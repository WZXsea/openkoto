name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
      - "wzx/**"
  pull_request:

jobs:
  backend-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openkoto_dev
          POSTGRES_USER: openkoto
          POSTGRES_PASSWORD: openkoto_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openkoto -d openkoto_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Backend service check
        run: cargo check --manifest-path openkoto-backend/Cargo.toml
        env:
          DATABASE_URL: postgres://openkoto:openkoto_dev_password@127.0.0.1:5433/openkoto_dev

      - name: Backend service tests
        run: cargo test --manifest-path openkoto-backend/Cargo.toml
        env:
          DATABASE_URL: postgres://openkoto:openkoto_dev_password@127.0.0.1:5433/openkoto_dev
          OPENKOTO_TEST_DATABASE_URL: postgres://openkoto:openkoto_dev_password@127.0.0.1:5433/openkoto_dev

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./textlingo-desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ripgrep

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node for bundled agent worker
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: textlingo-desktop/agent-worker/package-lock.json

      - name: Prepare bundled agent worker resources
        working-directory: .
        run: |
          npm --prefix textlingo-desktop/agent-worker ci
          npm --prefix textlingo-desktop run build:agent-worker

      - name: Verify Pi agent runtime guardrails
        working-directory: .
        run: |
          EXPECTED_VERSION="$(node -p "require('./textlingo-desktop/package.json').version")" \
            bash script/verify_pr12_assistant_observability.sh

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download sidecar binaries
        working-directory: .
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        working-directory: .
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Prepare frontend dist for Tauri context
        working-directory: .
        run: mkdir -p textlingo-desktop/dist

      - name: Rust tests
        run: cargo test --all-features --all-targets

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./textlingo-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: textlingo-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend test + coverage gate
        run: npm run coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run e2e
