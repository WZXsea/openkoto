name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openkoto_release
          POSTGRES_USER: openkoto
          POSTGRES_PASSWORD: openkoto_release_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openkoto -d openkoto_release"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            textlingo-desktop/package-lock.json
            textlingo-desktop/agent-worker/package-lock.json

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: Install agent worker dependencies
        run: npm ci
        working-directory: ./textlingo-desktop/agent-worker

      - name: Build and test agent worker
        run: npm run typecheck && npm run test && npm run build
        working-directory: ./textlingo-desktop/agent-worker

      - name: Verify Pi agent runtime guardrails
        run: |
          EXPECTED_VERSION="$(node -p "require('./textlingo-desktop/package.json').version")" \
            bash script/verify_pr12_assistant_observability.sh

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./textlingo-desktop

      - name: Build frontend production bundle
        run: npm run build
        working-directory: ./textlingo-desktop

      - name: Backend service checks and tests
        run: |
          cargo fmt --manifest-path openkoto-backend/Cargo.toml --all -- --check
          cargo check --manifest-path openkoto-backend/Cargo.toml
          cargo test --manifest-path openkoto-backend/Cargo.toml --no-fail-fast
        env:
          DATABASE_URL: postgres://openkoto:openkoto_release_password@127.0.0.1:5433/openkoto_release
          OPENKOTO_TEST_DATABASE_URL: postgres://openkoto:openkoto_release_password@127.0.0.1:5433/openkoto_release

      - name: Download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Desktop Rust format, check, and tests
        run: |
          cargo fmt --all -- --check
          cargo check --all-features --all-targets
          cargo test --all-features --all-targets
        working-directory: ./textlingo-desktop/src-tauri

      - name: Frontend coverage gate (>=80%)
        run: npm run coverage
        working-directory: ./textlingo-desktop

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ./textlingo-desktop

      - name: Playwright E2E
        run: npm run e2e
        working-directory: ./textlingo-desktop

  publish-tauri:
    needs: ci-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles app,dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg postgresql@16

      - name: verify Apple release credentials (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            APPLE_API_KEY_CONTENT APPLE_API_ISSUER APPLE_API_KEY APPLE_TEAM_ID
            KEYCHAIN_PASSWORD
          )
          missing=()
          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then missing+=("$variable"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Apple release secrets: ${missing[*]}"
            exit 1
          fi

      - name: import Apple Developer ID certificate (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: prepare Apple notarization key (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: install agent worker dependencies
        run: npm ci
        working-directory: ./textlingo-desktop/agent-worker

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: stage PDF offline assets
        run: python script/build_pdf_offline_assets.py
        shell: bash

      - name: verify release version
        env:
          OPENKOTO_RELEASE_TAG: ${{ github.ref_name }}
        run: bash script/verify_release_version.sh
        shell: bash

      - name: build packaged local runtime (macos only)
        if: startsWith(matrix.platform, 'macos-')
        working-directory: ./textlingo-desktop
        run: |
          export POSTGRES_CONFIG="$(brew --prefix postgresql@16)/bin/pg_config"
          npm run build:backend-sidecar
          npm run build:postgres-runtime
          npm run build:node-runtime
          test -x src-tauri/resources/backend/openkoto-backend
          test -x src-tauri/resources/postgres/bin/postgres
          test -x src-tauri/resources/postgres/bin/initdb
          test -x src-tauri/resources/node/bin/node
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenKoto Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## Phase-one release candidate
            - Reading-first home, material library, immersive multi-format reader, annotations, and the canonical learning workbench.
            - Observable Assistant tasks with durable timelines, cancellation, retry lineage, artifact viewers, source return, and audited actions.
            - Packaged Axum Backend, PostgreSQL 16, Node.js, and agent-worker with upgrade backup and recovery diagnostics.

            ## Release guarantees
            - Backend, Desktop Rust, agent-worker, frontend coverage, and Playwright gates complete before packaging.
            - macOS Apple Silicon and Intel packages require Developer ID signing, notarization, staple validation, and packaged-resource smoke checks.
            - Phase one remains standalone and does not write to Anki, Zotero, MinerU, MCP, or other external applications.
          releaseDraft: true
          prerelease: false
          projectPath: "./textlingo-desktop"
          args: ${{ matrix.args }}

      - name: assert packaged resources and PDF sidecar entitlements (macos only)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find textlingo-desktop/src-tauri/target -type d -name "*.app" -path "*/release/bundle/macos/*" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          test -x "$APP/Contents/Resources/backend/openkoto-backend"
          test -x "$APP/Contents/Resources/postgres/bin/postgres"
          test -x "$APP/Contents/Resources/postgres/bin/initdb"
          test -x "$APP/Contents/Resources/node/bin/node"
          test -f "$APP/Contents/Resources/agent-worker/package.json"
          test -f "$APP/Contents/Resources/agent-worker/dist/index.js"
          test -f "$APP/Contents/Resources/agent-worker/dist/piRuntime.js"
          APP_ROOT="$PWD/$APP"
          "$APP_ROOT/Contents/Resources/node/bin/node" -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 19)) process.exit(1);
          '
          (
            cd "$APP_ROOT/Contents/Resources/agent-worker"
            "$APP_ROOT/Contents/Resources/node/bin/node" --input-type=module -e '
              await import("@earendil-works/pi-agent-core");
              await import("@earendil-works/pi-ai");
            '
          )
          grep -Eq '"pi-agent-core"' "$APP/Contents/Resources/agent-worker/dist/index.js"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          DMG=$(find textlingo-desktop/src-tauri/target -type f -name "*.dmg" -path "*/release/bundle/dmg/*" | head -1)
          if [ -z "$DMG" ]; then echo "::error::No DMG found"; exit 1; fi
          hdiutil verify "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"
          SIDECAR="$APP/Contents/MacOS/openkoto-pdf-translator"
          if [ ! -f "$SIDECAR" ]; then
            echo "::error::PDF sidecar not found at $SIDECAR"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          fi
          echo "--- signature ---"
          codesign -dvvv "$SIDECAR" 2>&1 | grep -iE "TeamIdentifier|Authority=|Signature" || true
          echo "--- entitlements ---"
          ENTS=$(codesign -d --entitlements - --xml "$SIDECAR" 2>/dev/null || codesign -d --entitlements - "$SIDECAR" 2>/dev/null || true)
          echo "$ENTS"
          if echo "$ENTS" | grep -q "disable-library-validation"; then
            echo "OK: disable-library-validation present on PDF sidecar"
          else
            echo "::error::disable-library-validation entitlement missing on PDF sidecar — PDF translation will fail at runtime"
            exit 1
          fi

  finalize-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
