name: openkoto-dev

services:
  openkoto-postgres:
    image: postgres:16-alpine
    container_name: openkoto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: openkoto_dev
      POSTGRES_USER: openkoto
      POSTGRES_PASSWORD: openkoto_dev_password
    ports:
      - "5433:5432"
    volumes:
      - openkoto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openkoto -d openkoto_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  openkoto_postgres_data:
